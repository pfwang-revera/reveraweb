    <h1>告诉我们您正在处理的事情</h1>
    <p class="lead">绝不强行推销。告诉我们让您夜不能寐的产品难题：迫在眉睫的截止日期、拿不到的供应商数据、无法佐证的声明，我们会坦诚告诉您能否帮忙以及如何帮忙。</p>
  </div></div>
  <div class="wrap pbody"><div class="pcols"><div>
    <form class="dform" id="contactform" novalidate>
      <div class="field"><label for="c-name">姓名</label><input id="c-name" type="text" autocomplete="name"></div>
      <div class="field"><label for="c-email">工作邮箱</label><input id="c-email" type="email" autocomplete="email"></div>
      <div class="field"><label for="c-company">公司 <span style="color:var(--faint);font-weight:400">（选填）</span></label><input id="c-company" type="text" autocomplete="organization"></div>
      <div class="field"><label for="c-msg">您想聊些什么？</label><textarea id="c-msg" rows="4" placeholder="您正在应对的痛点、相关法规或截止日期、拿不到的数据……"></textarea></div>
      <label class="consent"><input type="checkbox" id="c-consent"> 我同意 Keystone 使用上述信息回复我的咨询。详见我们的<a href="privacy.html" style="color:var(--blue);font-weight:600">隐私声明</a>。</label>
      <label class="consent"><input type="checkbox" id="c-optin"> 选填：不定期向我发送 Keystone 产品动态。</label>
      <button class="btn btn-primary" type="submit">发送</button>
      <p class="gdpr-note">更喜欢用邮件？请发送至 <a href="mailto:keystone@revera8.com" style="color:var(--blue);font-weight:600">keystone@revera8.com</a>。我们仅将您的信息用于回复，产品动态为选填项，仅在您主动选择后发送。</p>
    </form>
    <div class="form-ok2" id="contactok"><h3>谢谢，我们会尽快与您联系。</h3><p>每条消息我们都会认真阅读并亲自回复。</p></div>
    <script>(function(){var f=document.getElementById('contactform');if(!f)return;f.addEventListener('submit',function(e){e.preventDefault();var em=document.getElementById('c-email'),cs=document.getElementById('c-consent');if(!em.value){em.focus();return;}if(!cs.checked){cs.focus();cs.parentNode.style.color='#DC2626';return;}f.style.display='none';document.getElementById('contactok').style.display='block';});})();</script>
